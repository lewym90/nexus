<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0c0e12">
  <meta name="color-scheme" content="dark light">
  <meta name="description" content="Nexus – precyzyjne notatki. Prywatne, lokalne, bez konta.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Nexus">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <title>Nexus</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="aurora-bg"></div>

  <header class="app-header">
    <div class="header-left">
      <button class="icon-btn menu-toggle" id="menuToggle" aria-label="Menu" aria-controls="sidebar">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
      </button>
      <div class="logo">
        <img src="icons/icon-192.png" alt="" class="logo-img">
        <span class="logo-text">Nexus</span>
      </div>
    </div>
    <div class="header-center">
      <div class="search-wrapper">
        <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <input type="search" id="searchInput" placeholder="Szukaj notatek…  (Ctrl/⌘ K)" class="search-input" aria-label="Szukaj notatek" autocomplete="off">
      </div>
    </div>
    <div class="header-right">
      <select id="workspaceSelect" class="workspace-select header-ws" aria-label="Przestrzeń robocza"></select>
      <button class="icon-btn" id="themeToggle" aria-label="Przełącz motyw" title="Motyw jasny/ciemny">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
      </button>
      <button class="icon-btn" id="graphBtn" aria-label="Graf powiązań" title="Graf powiązań">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="2"/><circle cx="6" cy="6" r="2"/><circle cx="18" cy="6" r="2"/><circle cx="6" cy="18" r="2"/><circle cx="18" cy="18" r="2"/><path d="M8 8l4 4M16 8l-4 4M8 16l4-4M16 16l-4-4"/></svg>
      </button>
      <button class="fab new-note-btn" id="newNoteBtn" aria-label="Nowa notatka">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>
        <span>Nowa</span>
      </button>
    </div>
  </header>

  <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

  <aside class="sidebar" id="sidebar">
    <nav class="sidebar-nav">
      <button class="nav-item active" data-view="all">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
        Wszystkie
      </button>
      <button class="nav-item" data-view="recent">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        Ostatnie
      </button>
      <button class="nav-item" data-view="favorites">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
        Ulubione
      </button>
      <button class="nav-item" data-view="journal">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
        Dziennik
      </button>
      <button class="nav-item" data-view="archive">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="5" rx="1"/><path d="M4 8v11a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8M10 12h4"/></svg>
        Archiwum
      </button>
      <button class="nav-item" data-view="trash">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
        Kosz <span class="nav-count" id="trashCount"></span>
      </button>
    </nav>

    <div class="sidebar-section ws-section">
      <h3>Przestrzeń</h3>
      <select id="workspaceSelectSide" class="workspace-select side-ws" aria-label="Przestrzeń robocza"></select>
      <div class="inline-actions">
        <button class="text-btn" id="newWorkspaceBtn">+ Nowa</button>
        <button class="text-btn" id="renameWorkspaceBtn">Zmień nazwę</button>
        <button class="text-btn danger" id="deleteWorkspaceBtn">Usuń</button>
      </div>
    </div>

    <div class="sidebar-section">
      <h3>Foldery</h3>
      <div id="foldersList" class="folders-list"></div>
      <button class="text-btn" id="newFolderBtn">+ Nowy folder</button>
    </div>

    <div class="sidebar-section">
      <h3>Tagi</h3>
      <div id="tagsList" class="tags-list"></div>
    </div>

    <div class="sidebar-footer">
      <button class="text-btn" id="templatesBtn">Szablony</button>
      <button class="text-btn" id="exportBtn">Eksportuj</button>
      <button class="text-btn" id="importBtn">Importuj</button>
    </div>
  </aside>

  <main class="main-content" id="mainContent">
    <div class="view notes-view active" id="notesView">
      <div class="notes-header">
        <h1 id="viewTitle">Wszystkie notatki</h1>
        <button class="text-btn danger" id="emptyTrashBtn" style="display:none;">Opróżnij kosz</button>
        <div class="view-controls">
          <div class="seg">
            <button class="view-btn active" data-layout="grid">Siatka</button>
            <button class="view-btn" data-layout="list">Lista</button>
          </div>
          <select id="sortSelect" class="sort-select" aria-label="Sortowanie">
            <option value="updated">Najnowsze</option>
            <option value="created">Data utworzenia</option>
            <option value="title">Tytuł</option>
          </select>
        </div>
      </div>
      <form class="quick-bar" id="quickBar" autocomplete="off">
        <input type="text" id="quickInput" class="quick-input" placeholder="Szybka notatka…" aria-label="Szybka notatka" enterkeyhint="done">
        <button type="submit" class="quick-btn" aria-label="Dodaj szybką notatkę" title="Dodaj">＋</button>
        <button type="button" class="quick-btn" id="clipboardBtn" aria-label="Nowa notatka ze schowka" title="Nowa notatka ze schowka">📋</button>
      </form>
      <input type="search" id="searchInputMobile" placeholder="Szukaj notatek…" class="search-input mobile-search" aria-label="Szukaj notatek" autocomplete="off">
      <div class="active-filters" id="activeFilters"></div>
      <div class="notes-grid" id="notesGrid"></div>
      <div class="empty-state" id="emptyState">
        <div class="empty-orb"></div>
        <h2 id="emptyTitle">Brak notatek</h2>
        <p id="emptyText">Stwórz pierwszą notatkę, aby rozpocząć.</p>
        <button class="primary-btn" id="emptyNewBtn">Utwórz notatkę</button>
        <button class="text-btn" id="emptyTemplatesBtn" style="margin-top:12px;">Użyj szablonu</button>
      </div>
    </div>

    <div class="view graph-view" id="graphView">
      <div class="notes-header">
        <h1>Graf powiązań</h1>
        <div class="view-controls">
          <select id="graphTag" class="sort-select" aria-label="Filtr tagu"></select>
          <button class="text-btn" id="closeGraphBtn">Zamknij</button>
        </div>
      </div>
      <div class="graph-wrap">
        <canvas id="graphCanvas" aria-label="Graf powiązań między notatkami"></canvas>
        <div class="graph-controls">
          <button type="button" id="graphZoomIn" aria-label="Przybliż">＋</button>
          <button type="button" id="graphZoomOut" aria-label="Oddal">－</button>
          <button type="button" id="graphFit" aria-label="Dopasuj widok" title="Dopasuj">⤢</button>
          <button type="button" id="graphRelayout" aria-label="Przelicz układ" title="Przelicz układ">↻</button>
        </div>
      </div>
      <div id="graphInfo" class="graph-info"></div>
    </div>

    <div class="view editor-view" id="editorView">
      <div class="editor-header">
        <button class="icon-btn back-btn" id="backBtn" aria-label="Wróć">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        </button>
        <input type="text" id="noteTitle" class="title-input" placeholder="Tytuł notatki…" aria-label="Tytuł notatki" autocomplete="off">
        <div class="editor-actions">
          <span id="saveStatus" class="save-status" aria-live="polite"></span>
          <button class="icon-btn" id="pinBtn" aria-label="Przypnij" title="Przypnij">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 17v5M5 17h14v-1.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V6h1a2 2 0 0 0 0-4H8a2 2 0 0 0 0 4h1v4.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24Z"/></svg>
          </button>
          <button class="icon-btn" id="favoriteBtn" aria-label="Ulubione" title="Ulubione">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
          </button>
          <button class="icon-btn" id="previewToggle" aria-label="Podgląd" title="Podgląd Markdown">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
          <button class="icon-btn" id="archiveBtn" aria-label="Archiwizuj" title="Archiwizuj">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="5" rx="1"/><path d="M4 8v11a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8M10 12h4"/></svg>
          </button>
          <button class="icon-btn delete-btn" id="deleteBtn" aria-label="Usuń" title="Usuń">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
          </button>
        </div>
      </div>
      <div class="trash-banner" id="trashBanner" style="display:none;">
        <span>Ta notatka jest w koszu.</span>
        <button class="modal-btn primary" id="restoreBtn">Przywróć</button>
        <button class="modal-btn danger" id="purgeBtn">Usuń trwale</button>
      </div>
      <div class="editor-body">
        <div class="md-toolbar" id="mdToolbar" role="toolbar" aria-label="Formatowanie">
          <button type="button" data-md="h" aria-label="Nagłówek"><b>H</b></button>
          <button type="button" data-md="bold" aria-label="Pogrubienie"><b>B</b></button>
          <button type="button" data-md="italic" aria-label="Kursywa"><i>I</i></button>
          <button type="button" data-md="ul" aria-label="Lista">• Lista</button>
          <button type="button" data-md="task" aria-label="Zadanie">☐ Zadanie</button>
          <button type="button" data-md="outdent" aria-label="Zmniejsz wcięcie">⇤</button>
          <button type="button" data-md="indent" aria-label="Zwiększ wcięcie">⇥</button>
          <button type="button" data-md="table" aria-label="Tabela">▦ Tabela</button>
          <button type="button" data-md="codeblock" aria-label="Blok kodu">{ }</button>
          <button type="button" data-md="quote" aria-label="Cytat">❝</button>
          <button type="button" data-md="code" aria-label="Kod">&lt;/&gt;</button>
          <button type="button" data-md="link" aria-label="Link do notatki">[[ ]]</button>
        </div>
        <textarea id="noteContent" class="content-input" aria-label="Treść notatki" placeholder="Zacznij pisać…&#10;&#10;Markdown: **pogrubienie**, *kursywa*, # nagłówki, - listy&#10;[[Nazwa notatki]] do linkowania"></textarea>
        <div id="markdownPreview" class="markdown-preview" style="display:none;"></div>
        <div class="word-count" id="wordCount"></div>
        <div class="editor-meta">
          <div class="meta-row tags-input-wrapper">
            <span>Tagi:</span>
            <input type="text" id="tagsInput" placeholder="tagi oddzielone przecinkami" autocomplete="off" autocapitalize="none">
          </div>
          <div class="meta-row">
            <span>Folder:</span>
            <select id="folderSelect"></select>
          </div>
          <div class="meta-row aura-picker" id="auraPicker">
            <span>Kolor:</span>
            <div class="aura-colors">
              <button class="aura-dot" data-color="#3b82f6" style="background:#3b82f6" aria-label="Niebieski"></button>
              <button class="aura-dot" data-color="#d4a017" style="background:#d4a017" aria-label="Złoty"></button>
              <button class="aura-dot" data-color="#10b981" style="background:#10b981" aria-label="Zielony"></button>
              <button class="aura-dot" data-color="#ef4444" style="background:#ef4444" aria-label="Czerwony"></button>
              <button class="aura-dot" data-color="#8b5cf6" style="background:#8b5cf6" aria-label="Fioletowy"></button>
              <button class="aura-dot" data-color="#06b6d4" style="background:#06b6d4" aria-label="Turkusowy"></button>
            </div>
          </div>
          <div class="meta-col">
            <label class="file-btn">
              + Dodaj obraz
              <input type="file" id="attachmentInput" accept="image/*" multiple hidden>
            </label>
            <div id="attachmentsList" class="attachments-list"></div>
          </div>
          <div class="meta-col" id="backlinksBox" style="display:none;">
            <span class="meta-label">Linkują tutaj:</span>
            <div id="backlinksList" class="backlinks-list"></div>
          </div>
          <div class="meta-col">
            <button class="text-btn" id="saveTemplateBtn">Zapisz jako szablon</button>
          </div>
        </div>
      </div>
    </div>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
