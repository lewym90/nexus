name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Składnia modułów
        run: for f in js/*.js sw.js; do node --check "$f"; done

      - name: Testy jednostkowe
        run: npm run test:unit

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Playwright (Chromium)
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Testy E2E (telefon)
        run: python3 tests/e2e.py mobile

      - name: Testy E2E (desktop)
        run: python3 tests/e2e.py desktop
